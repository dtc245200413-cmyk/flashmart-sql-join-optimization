<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Inter, sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">FLASHMART SQL JOIN ARCHITECTURE &amp; SET THEORY</text>
  <text x="500" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Phân tích tập hợp: INNER JOIN vs LEFT JOIN vs ANTI-JOIN (LEFT JOIN ... WHERE IS NULL)</text>

  <!-- Card 1: INNER JOIN -->
  <g transform="translate(40, 110)">
    <rect width="280" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="40" rx="12" fill="#334155"/>
    <text x="140" y="26" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">1. INNER JOIN (Giao nhau)</text>
    
    <!-- Circles -->
    <circle cx="110" cy="130" r="60" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="170" cy="130" r="60" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <!-- Intersection clip/highlight -->
    <path d="M 140,84 A 60,60 0 0,1 140,176 A 60,60 0 0,1 140,84" fill="#f59e0b" fill-opacity="0.8" stroke="#f59e0b" stroke-width="2"/>
    
    <text x="80" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">Customers</text>
    <text x="200" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">Orders</text>
    <text x="140" y="135" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Alice, Bob</text>

    <!-- Content -->
    <rect x="15" y="210" width="250" height="85" rx="8" fill="#0f172a"/>
    <text x="25" y="235" fill="#ef4444" font-size="12" font-weight="bold">❌ Lỗi của Thực tập sinh:</text>
    <text x="25" y="255" fill="#cbd5e1" font-size="11">Charlie (0 đơn) bị loại bỏ hoàn toàn</text>
    <text x="25" y="275" fill="#cbd5e1" font-size="11">Không đủ điều kiện tặng Voucher</text>

    <text x="140" y="325" text-anchor="middle" fill="#38bdf8" font-weight="bold" font-size="13">Tập kết quả: 2 dòng</text>
    <rect x="25" y="340" width="230" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="365" fill="#e2e8f0" font-size="11">1 | Alice | 2 đơn hàng</text>
    <text x="35" y="390" fill="#e2e8f0" font-size="11">2 | Bob   | 1 đơn hàng</text>
    <text x="35" y="415" fill="#64748b" font-size="11">(Charlie bị mất tích)</text>
  </g>

  <!-- Card 2: LEFT JOIN (Marketing Solution) -->
  <g transform="translate(360, 110)">
    <rect width="280" height="440" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect width="280" height="40" rx="12" fill="#065f46"/>
    <text x="140" y="26" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">2. LEFT JOIN (Marketing Report)</text>
    
    <!-- Circles: Highlight Entire Left Circle -->
    <circle cx="110" cy="130" r="60" fill="#10b981" fill-opacity="0.6" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="170" cy="130" r="60" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-width="1.5"/>
    
    <text x="85" y="135" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Charlie (NULL)</text>
    <text x="140" y="135" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Alice, Bob</text>
    <text x="200" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">Orders</text>

    <!-- Content -->
    <rect x="15" y="210" width="250" height="85" rx="8" fill="#0f172a"/>
    <text x="25" y="235" fill="#10b981" font-size="12" font-weight="bold">✅ Giải pháp Chuẩn xác:</text>
    <text x="25" y="255" fill="#cbd5e1" font-size="11">Bảo toàn 100% Driving Table</text>
    <text x="25" y="275" fill="#cbd5e1" font-size="11">COUNT(o.order_id) = 0 cho Charlie</text>

    <text x="140" y="325" text-anchor="middle" fill="#34d399" font-weight="bold" font-size="13">Tập kết quả: ĐỦ 3 dòng</text>
    <rect x="25" y="340" width="230" height="85" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="35" y="365" fill="#e2e8f0" font-size="11">1 | Alice   | 2 đơn</text>
    <text x="35" y="390" fill="#e2e8f0" font-size="11">2 | Bob     | 1 đơn</text>
    <text x="35" y="415" fill="#facc15" font-size="11" font-weight="bold">3 | Charlie | 0 đơn ➔ VOUCHER 50%</text>
  </g>

  <!-- Card 3: ANTI-JOIN (Warehouse Solution) -->
  <g transform="translate(680, 110)">
    <rect width="280" height="440" rx="12" fill="#1e293b" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <rect width="280" height="40" rx="12" fill="#78350f"/>
    <text x="140" y="26" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">3. ANTI-JOIN (Kho vận Report)</text>
    
    <!-- Circles: Highlight Left Crescent Only -->
    <path d="M 110,70 A 60,60 0 1,0 110,190 A 60,60 0 0,1 140,84 A 60,60 0 0,0 110,70" fill="#f59e0b" fill-opacity="0.8" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="170" cy="130" r="60" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <text x="80" y="135" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Keyboard</text>
    <text x="140" y="135" text-anchor="middle" fill="#64748b" font-size="10">Đã bán</text>
    <text x="200" y="135" text-anchor="middle" fill="#64748b" font-size="10">Orders</text>

    <!-- Content -->
    <rect x="15" y="210" width="250" height="85" rx="8" fill="#0f172a"/>
    <text x="25" y="235" fill="#f59e0b" font-size="12" font-weight="bold">🎯 Kỹ thuật Anti-Join:</text>
    <text x="25" y="255" fill="#cbd5e1" font-size="11">LEFT JOIN ... WHERE o.order_id IS NULL</text>
    <text x="25" y="275" fill="#cbd5e1" font-size="11">Lọc chính xác các bản ghi mồ côi</text>

    <text x="140" y="325" text-anchor="middle" fill="#fbbf24" font-weight="bold" font-size="13">Tập kết quả: 1 dòng</text>
    <rect x="25" y="340" width="230" height="85" rx="6" fill="#0f172a" stroke="#d97706"/>
    <text x="35" y="365" fill="#facc15" font-size="11" font-weight="bold">103 | Keyboard</text>
    <text x="35" y="390" fill="#94a3b8" font-size="11">Trạng thái: Cần thanh lý kho</text>
    <text x="35" y="415" fill="#34d399" font-size="11">Khôi phục 100% dòng bị ẩn!</text>
  </g>
</svg>
